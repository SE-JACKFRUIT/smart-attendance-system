{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h3 class="mb-2">Welcome - create your Admin account</h3>
    <p class="text-muted">No admin exists yet. Choose any username and password you like.</p>
    <form method="post" class="card card-body">
      <div class="mb-3">
        <label class="form-label">Admin username</label>
        <input type="text" name="username" class="form-control" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">Password (min 6 characters)</label>
        <input type="password" name="password" class="form-control" required minlength="6">
      </div>
      <div class="mb-3">
        <label class="form-label">Confirm password</label>
        <input type="password" name="confirm" class="form-control" required minlength="6">
      </div>
      <button class="btn btn-primary" type="submit">Create admin account</button>
    </form>
  </div>
</div>
{% endblock %}
