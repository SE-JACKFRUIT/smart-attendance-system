name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies (headless OpenCV - CI has no display/webcam)
        run: |
          python -m pip install --upgrade pip
          pip install Flask numpy pandas opencv-contrib-python-headless pytest bandit
      - name: Run tests
        run: python -m pytest -v
      - name: Security scan (bandit)
        run: bandit -r app.py -ll
